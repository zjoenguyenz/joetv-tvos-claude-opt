name: JoeTV
options:
  bundleIdPrefix: com.luun.nguyen
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    # Swift 6 language mode for the whole project (owner order
    # 2026-11-18). This repo was split out of the dabanh-ios
    # monorepo on 2026-11-18 so JoeTV migrates on its own track;
    # strict concurrency is part of the Swift 6 language mode.
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
packages:
  # KSPlayer (FFmpeg engine) for the torrent path only — AVPlayer
  # has no Matroska demuxer, so Torrentio/RD direct files
  # (predominantly MKV) could never start. Upgraded 2026-11-18
  # from 2.3.4 to 5.6.2: the 5.x line is the Swift 6 release line
  # (Package.swift at tag 5.6.2 declares swift-tools-version 6.2;
  # the "KSPlayer" product is a prebuilt xcframework and the UI
  # layer ships as the separate "KSPlayerUI" product). JoeTV's
  # player is hand-built on KSPlayerLayer from the core module,
  # so only the "KSPlayer" product is linked — plus FFmpegKit
  # below, which 5.6.2 makes the CONSUMER's job (see there).
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: "5.6.2"
  # FFmpegKit — required by KSPlayer 5.6.2 even though JoeTV never
  # calls it directly. In 2.3.4 the "KSPlayer" product was a source
  # target that itself depended on the FFmpegKit product, so the
  # FFmpeg modules arrived transitively. In 5.6.2 the product is a
  # bare binaryTarget with NO dependencies, while its
  # .swiftinterface still imports Libavcodec, Libavformat and
  # libdovi — so an app linking KSPlayer alone fails its
  # SwiftDriver step with missing-module errors (joetv-tvos CI
  # run #1). KSPlayer's own source targets (KSPlayerUI, MPVPlayer)
  # both depend on this product; linking it here mirrors that
  # intended graph and also satisfies KSPlayer.xcframework's link
  # references. 9.0.2 is the floor KSPlayer 5.6.2's own manifest
  # declares (from: "9.0.2"); pinned exactly, like KSPlayer.
  FFmpegKit:
    url: https://github.com/kingslay/FFmpegKit.git
    exactVersion: "9.0.2"
  # libwebp for the image pipeline's WebP fallback — Tủ Phim
  # posters exist ONLY as WebP and some KKPhim posters are WebP
  # too, and tvOS ImageIO has no WebP codec, so those slots
  # silently fell back to a different (TMDB) poster.
  # JoeImagePipeline calls libwebp's C decode API directly; no
  # SDWebImage core is pulled in. Pinned exactly, like KSPlayer.
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode.git
    exactVersion: "1.6.0"
targets:
  JoeTV:
    type: application
    platform: tvOS
    sources:
      - DaBanh/Channel.swift
      - DaBanh/LeagueClassifier.swift
      - DaBanh/M3UParser.swift
      - DaBanh/LinkProbe.swift
      - DaBanhTV/TVPlayerView.swift
      - TVApp/TVStore.swift
      - JoeTV/JoeModels.swift
      - JoeTV/JoeHTTP.swift
      - JoeTV/JoeDiagLog.swift
      - JoeTV/JoeStorage.swift
      - JoeTV/SourceHealth.swift
      - JoeTV/KkClient.swift
      - JoeTV/VsClient.swift
      - JoeTV/F4kClient.swift
      - JoeTV/TpClient.swift
      - JoeTV/CacheVideo.swift
      - JoeTV/JoeProxy.swift
      - JoeTV/Providers.swift
      - JoeTV/WatchStore.swift
      - JoeTV/JoeFollowStore.swift
      - JoeTV/JoeChannelFavourites.swift
      - JoeTV/JoeActorPage.swift
      - JoeTV/TorrentClient.swift
      - JoeTV/JoePlayerView.swift
      - JoeTV/JoeStreamWarmer.swift
      - JoeTV/JoeKSPlayerView.swift
      - JoeTV/JoeTheme.swift
      - JoeTV/JoePrivateCinema.swift
      - JoeTV/JoeImagePipeline.swift
      - JoeTV/JoeTVApp.swift
      - JoeTV/JoeTopShelfWriter.swift
      - JoeTV/JoeTVSection.swift
      - JoeTV/JoePhimHome.swift
      - JoeTV/JoeHomeScreen.swift
      - JoeTV/JoeHomeTVBFocus.swift
      - JoeTV/JoeBrowse.swift
      - JoeTV/JoeMovieDetail.swift
      - JoeTV/JoeDetailCache.swift
      - JoeTV/JoeSearch.swift
      - JoeTV/JoeTVB.swift
      - JoeTV/tvb-catalog.json
      # TVB YouTube feature (design plan 2026-11-19): the
      # catalogue data + model/store, the detail screen, the
      # web layer (player model, session, door) and the
      # contained ObjC WebKit bridge (.h/.m + bridging
      # header) — the ONLY files that touch the runtime-
      # resolved WebKit surface.
      - JoeTV/tvb-yt.json
      - JoeTV/JoeYtCatalog.swift
      # v2.0.48: the backdrop preview (Leg 3) and the
      # per-series measured quality map (Leg 4).
      - JoeTV/JoePreview.swift
      - JoeTV/JoeYtQuality.swift
      - JoeTV/JoeYtDetail.swift
      - JoeTV/JoeYtWeb.swift
      - JoeTV/JoeWebBridge.h
      - JoeTV/JoeWebBridge.m
      - JoeTV/JoeTV-Bridging-Header.h
      # v2.0.42: the native YouTube route (owner's
      # single-route ruling, 2026-11-20) — device-code
      # identity, the tv_samsung resolver + vendored EJS
      # solver (resources), the local-HLS assembly server,
      # the native queue player and the play router. The
      # two solver .js files ride as bundle resources.
      - JoeTV/JoeYtIdentity.swift
      - JoeTV/JoeYtResolver.swift
      - JoeTV/JoeYtHlsServer.swift
      - JoeTV/JoeYtNativePlayer.swift
      - JoeTV/JoeYtPlayRouter.swift
      - path: JoeTV/yt.solver.lib.min.js
        buildPhase: resources
      - path: JoeTV/yt.solver.core.min.js
        buildPhase: resources
      # Fault 17 fix round (2026-11-22): the Private Cinema
      # design's three type families, bundled (the design's
      # spec sheet names Outfit / Bricolage Grotesque /
      # Instrument Serif; tvOS ships none of them). Static
      # instances from Google Fonts (OFL), registered via
      # UIAppFonts below; used ONLY by the Private Cinema
      # theme through JoePCType (JoeTheme.swift).
      - path: JoeTV/Fonts/Outfit-Light.ttf
        buildPhase: resources
      - path: JoeTV/Fonts/Outfit-Regular.ttf
        buildPhase: resources
      - path: JoeTV/Fonts/Outfit-Medium.ttf
        buildPhase: resources
      - path: JoeTV/Fonts/Outfit-SemiBold.ttf
        buildPhase: resources
      - path: JoeTV/Fonts/Outfit-Bold.ttf
        buildPhase: resources
      - path: JoeTV/Fonts/BricolageGrotesque-Regular.ttf
        buildPhase: resources
      - path: JoeTV/Fonts/BricolageGrotesque-Medium.ttf
        buildPhase: resources
      - path: JoeTV/Fonts/BricolageGrotesque-SemiBold.ttf
        buildPhase: resources
      - path: JoeTV/Fonts/InstrumentSerif-Regular.ttf
        buildPhase: resources
      - path: JoeTV/Fonts/InstrumentSerif-Italic.ttf
        buildPhase: resources
      - JoeTV/JoeTorrent.swift
      - JoeTV/JoeTrendingFile.swift
      - JoeTV/JoeSettings.swift
      # v2.0.45 (leg 3): the user addon (Stremio) — the
      # client + library store and its meta detail.
      - JoeTV/JoeAddon.swift
      - JoeTV/JoeAddonDetail.swift
      - JoeTV/JoeStores.swift
      - JoeTV/SourceProbe.swift
      - JoeTV/TMDBClient.swift
      - JoeTV/TMDBKey.swift
      - JoeTV/BundledTokens.swift
      - JoeTV/Assets.xcassets
    dependencies:
      - package: KSPlayer
      - package: FFmpegKit
      - package: libwebp
      - target: JoeTVTopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luun.nguyen.joetv
        INFOPLIST_FILE: InfoJoeTV.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: JoeTV/JoeTV-Bridging-Header.h
        MARKETING_VERSION: "2.1.7"
        CURRENT_PROJECT_VERSION: "70"
    info:
      path: InfoJoeTV.plist
      properties:
        CFBundleDisplayName: "Joe TV"
        CFBundleName: "Joe TV"
        CFBundleShortVersionString: "2.1.7"
        CFBundleVersion: "70"
        CFBundleIconName: "AppIcon"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: "AppIcon"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # v2.0.33: the diagnostic-log export serves the log
        # file over the home LAN from Settings (tvOS has no
        # share sheet), so the app declares its local-network
        # use: the iPhone downloads the log at the address the
        # Settings screen shows.
        NSLocalNetworkUsageDescription: "Joe TV mở một kênh trong mạng nhà để anh tải file log chẩn đoán từ Apple TV về iPhone."
        CFBundleURLTypes:
          - CFBundleURLName: com.luun.nguyen.joetv
            CFBundleURLSchemes:
              - joetv
        # Fault 17 fix round: the bundled Private Cinema
        # type families (see the Fonts resources above).
        UIAppFonts:
          - Outfit-Light.ttf
          - Outfit-Regular.ttf
          - Outfit-Medium.ttf
          - Outfit-SemiBold.ttf
          - Outfit-Bold.ttf
          - BricolageGrotesque-Regular.ttf
          - BricolageGrotesque-Medium.ttf
          - BricolageGrotesque-SemiBold.ttf
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
    entitlements:
      path: JoeTV/JoeTV.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.luun.nguyen.joetv
  JoeTVTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - JoeTVTopShelf/TopShelfProvider.swift
      # v2.0.40 (audit P0.5 / L-2): TMDBShelfKey.swift is OUT
      # of this target. Nothing reads it (the provider's own
      # decision record: the runtime TMDB fetch was removed,
      # the key slot has been unreferenced since v2.0.12),
      # yet the build workflow still writes the real TMDB key
      # into that file before XcodeGen runs — while it was a
      # target source, the key was compiled into the
      # extension binary for no reason. The file may still be
      # written to disk by CI; it is simply never compiled.
